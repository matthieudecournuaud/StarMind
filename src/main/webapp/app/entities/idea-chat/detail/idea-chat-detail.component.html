<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (ideaChat(); as ideaChatRef) {
      <div>
        <h2 data-cy="ideaChatDetailsHeading"><span jhiTranslate="starMindApp.ideaChat.detail.title">Idea Chat</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ ideaChatRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="starMindApp.ideaChat.name">Name</span></dt>
          <dd>
            <span>{{ ideaChatRef.name }}</span>
          </dd>
          <dt><span jhiTranslate="starMindApp.ideaChat.users">Users</span></dt>
          <dd>
            @for (users of ideaChatRef.users; track $index; let last = $last) {
              <span> {{ users.id }}{{ last ? '' : ', ' }} </span>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/idea-chat', ideaChatRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
